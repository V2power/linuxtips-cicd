name: Build e Testes
on:
  workflow_call:
    inputs:
      versao:
        type: number
        required: true
        default: 1
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: echo "A versão dessa build é ${{ inputs.versao }}"
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test
        run: echo "Testes executados com sucesso!"