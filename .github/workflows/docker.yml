name: Desafio 1 - Docker
on:
  workflow_dispatch:
    inputs:
      image_name:
        type: string
        description: "Please type the docker image"
        default: "nginx:latest"
        required: true
jobs:
    download:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v7.0.1
          -
            name: Login to Docker Hub
            uses: docker/login-action@v4
            with:
              username: ${{ vars.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}
          - name: Docker Setup Docker
            uses: docker/setup-docker-action@v5.4.0
          - name: Docker Pull
            run: docker pull ${{ github.event.inputs.image_name }}
          - name: List image
            run: |
              $DOCKER_IMAGE=$(echo "${{ github.event.inputs.image_name}}" | cut -d: -f1) 
              docker images | grep $DOCKER_IMAGE
          - name: Docker Scout
            id: docker-scout
            uses: docker/scout-action@v1
            with:
              image: $DOCKER_IMAGE
              command: cves,recommendations
              to-latest: true
              ignore-base: true
              ignore-unchanged: true
              only-fixed: true
