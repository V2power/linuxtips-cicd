name: CI Quality Gate
on:
  workflow_dispatch:
    inputs:
      porcentagem:
        type: number
        required: true
      vulnerabilidades:
        type: number
        required: true
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: CoberturaS
        id: coverage
        run: echo "porcentagem=${{inputs.porcentagem}}" >> $GITHUB_OUTPUT
    outputs:
      cobertura: ${{ steps.coverage.outputs.porcentagem }}

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Segurança
        id: security
        run: echo "vulnerabilidades=${{inputs.vulnerabilidades}}" >> $GITHUB_OUTPUT
    outputs:
      vulnerabilidades: ${{steps.security.outputs.vulnerabilidades}}
  quality-gate:
    needs: [tests, security]
    runs-on: ubuntu-latest
    steps:
      - name: Checagem de qualidade
        env:
          COVERAGE: ${{ needs.tests.outputs.cobertura }}
          VULNERABILITIES: ${{ needs.security.outputs.vulnerabilidades }}
          MINIMUM_COVERAGE: ${{ vars.COBERTURA_MINIMA }}
        run: |
          echo "Coberetura mínima: $MINIMUMss_COVERAGE%"
          echo "Cobertura obtida: $COVERAGE%"
          echo "Vulnerabilidades: $VULNERABILITIES"
          if (( COVERAGE >= MINIMUM_COVERAGE && VULNERABILITIES == 0 )); then
            echo "Build aprovado!"
            exit 0
          fi
          echo "::error::Build reprovado!"
          exit 1
